<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Klozet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap {
      padding: 24px;
      max-width: 340px;
    }
    .dot {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #FF66C4;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 22px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #636366; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot">K</div>
    <h1>Klozet</h1>
    <p>Cargando tu armario...</p>
  </div>
</body>
</html>
